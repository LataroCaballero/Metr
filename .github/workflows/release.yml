name: Release

# A v* tag builds the app on GitHub, re-signs it ad hoc, makes the DMG and its SHA-256 and opens a DRAFT
# release. The owner publishes by hand (D-11). The build job only reads the repository; the token that
# can write a release exists only in the second job, which runs no package code.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      METR_CI: '1'
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Build, re-sign, verify and package
        run: bash scripts/release/build-release.sh "$TAG" --out "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  release:
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/dist
      - name: Create the draft release
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DIST="$RUNNER_TEMP/dist"
          flags=(--draft --verify-tag --title "Metr $VERSION" --notes-file "$DIST/notes.md")
          case "$TAG" in
            *-rc.*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            "$DIST/Metr-$VERSION.dmg" "$DIST/Metr-$VERSION.dmg.sha256"
